[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthpdf"
version = "0.1.0"
description = "LLM-backed synthetic PDF and question-answer dataset generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt", "NOTICE.md", "src/synthpdf/resources/fonts/*OFL.txt"]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "jinja2>=3.1",
    "markdown>=3.4",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "pypdf>=3.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "openai>=1.0",
    "httpx>=0.27",
    "azure-identity>=1.15",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "seaborn>=0.13",
    "scipy>=1.11",
    "reportlab>=4.0",
    "PyMuPDF>=1.24",
    "playwright==1.58.0",
]

[project.optional-dependencies]
fallback-renderers = ["weasyprint>=60.0", "xhtml2pdf>=0.2.11"]
dev = ["pytest>=7.0", "build>=1.0"]

[project.scripts]
synthpdf = "synthpdf.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/synthpdf"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/experiments",
    "/README.md",
    "/LICENSE.txt",
    "/NOTICE.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/pyproject.toml",
    "/.gitignore",
    "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
