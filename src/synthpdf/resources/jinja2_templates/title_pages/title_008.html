<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<style>
@page { size: {{ page_size_css|default('1440px 900px') }}; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: white; }
.page { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 80px 120px; }
.company-label { font-size: 11px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; color: {{ primary_color|default('#1a237e') }}; margin-bottom: 48px; }
.title { font-size: 72px; font-weight: 200; color: #111; line-height: 1.1; max-width: 1100px; margin-bottom: 20px; }
.rule-row { display: flex; align-items: center; gap: 20px; margin: 20px 0 32px; }
.rule-short { height: 1px; background: {{ primary_color|default('#1a237e') }}; width: 80px; }
.rule-dot { width: 6px; height: 6px; border-radius: 50%; background: {{ accent_color|default('#3949ab') }}; }
.rule-long { flex: 1; height: 1px; background: #e0e0e0; }
.subtitle-txt { font-size: 18px; color: #888; font-weight: 300; letter-spacing: 0.5px; margin-bottom: 48px; }
.footer-row { display: flex; gap: 40px; align-items: center; }
.footer-item { font-size: 11px; color: #bbb; letter-spacing: 2px; text-transform: uppercase; }
.footer-sep { width: 1px; height: 20px; background: #e0e0e0; }
</style>
</head>
<body>
<div class="page">
  <div class="company-label">{{ company_name|default('Sample Organization') }}</div>
  <div class="title">{{ document_title|default('Strategic Performance Review') }}</div>
  <div class="rule-row"><div class="rule-short"></div><div class="rule-dot"></div><div class="rule-long"></div></div>
  <div class="subtitle-txt">{{ subtitle|default('Comprehensive Analysis and Outlook') }}</div>
  <div class="footer-row">
    <span class="footer-item">{{ report_type|default('Annual Report') }}</span>
    <div class="footer-sep"></div>
    <span class="footer-item">{{ year|default('2025') }}</span>
    <div class="footer-sep"></div>
    <span class="footer-item">{{ tagline|default('Data-Driven Decisions') }}</span>
  </div>
</div>
</body>
</html>
