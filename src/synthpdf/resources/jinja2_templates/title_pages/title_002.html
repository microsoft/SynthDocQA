<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<style>
@page { size: {{ page_size_css|default('1440px 900px') }}; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #ffffff; }
.wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.top-bar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: {{ primary_color|default('#1a237e') }}; }
.bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: {{ primary_color|default('#1a237e') }}; }
.circle { width: 100px; height: 100px; border-radius: 50%; background: {{ primary_color|default('#1a237e') }}; display: flex; align-items: center; justify-content: center; margin-bottom: 32px; }
.circle-text { font-size: 32px; font-weight: 800; color: white; }
.company-name { font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: {{ primary_color|default('#1a237e') }}; margin-bottom: 48px; }
.rule { width: 80px; height: 2px; background: {{ accent_color|default('#3949ab') }}; margin-bottom: 32px; }
.title { font-size: 42px; font-weight: 300; color: #1a1a2e; text-align: center; line-height: 1.3; max-width: 700px; margin-bottom: 20px; }
.subtitle { font-size: 16px; color: #666; letter-spacing: 1px; margin-bottom: 48px; }
.date-block { font-size: 12px; color: #999; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="top-bar"></div>
  <div class="circle"><span class="circle-text">{{ initials|default('SO') }}</span></div>
  <div class="company-name">{{ company_name|default('Sample Organization') }}</div>
  <div class="rule"></div>
  <div class="title">{{ document_title|default('Strategic Performance Review') }}</div>
  <div class="subtitle">{{ subtitle|default('Comprehensive Analysis and Outlook') }}</div>
  <div class="date-block">{{ report_type|default('Annual Report') }} &bull; {{ year|default('2025') }}</div>
  <div class="bottom-bar"></div>
</div>
</body>
</html>
