<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
<style>
@page { size: {{ page_size_css|default('1440px 900px') }}; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
.bg { width: 100%; height: 100%; background: linear-gradient(135deg, {{ primary_color|default('#1a237e') }} 0%, {{ accent_color|default('#3949ab') }} 60%, #0a0a2e 100%); position: relative; overflow: hidden; }
.watermark { position: absolute; top: -80px; right: -40px; font-size: 340px; font-weight: 900; color: rgba(255,255,255,0.04); line-height: 1; }
.header { position: absolute; top: 0; left: 0; right: 0; padding: 28px 48px; display: flex; justify-content: space-between; align-items: center; }
.company-label { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.55); letter-spacing: 3px; text-transform: uppercase; }
.year-label { font-size: 12px; color: rgba(255,255,255,0.35); letter-spacing: 2px; }
.content { position: absolute; bottom: 200px; left: 0; right: 0; padding: 0 80px; }
.report-label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.45); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
.title { font-size: 64px; font-weight: 900; color: white; line-height: 1.1; max-width: 900px; }
.bottom-band { position: absolute; bottom: 0; left: 0; right: 0; height: 160px; background: rgba(0,0,0,0.38); padding: 32px 80px; display: flex; align-items: center; justify-content: space-between; }
.subtitle { font-size: 20px; color: rgba(255,255,255,0.75); font-weight: 300; max-width: 700px; }
</style>
</head>
<body>
<div class="bg">
  <div class="watermark">{{ initials|default('SO') }}</div>
  <div class="header">
    <span class="company-label">{{ company_name|default('Sample Organization') }}</span>
    <span class="year-label">{{ year|default('2025') }}</span>
  </div>
  <div class="content">
    <div class="report-label">{{ report_type|default('Annual Report') }}</div>
    <div class="title">{{ document_title|default('Strategic Performance Review') }}</div>
  </div>
  <div class="bottom-band">
    <span class="subtitle">{{ subtitle|default('Comprehensive Analysis and Outlook') }}</span>
  </div>
</div>
</body>
</html>
